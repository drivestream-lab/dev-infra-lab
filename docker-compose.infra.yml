# Shared local-dev lab (Compose project: dev-infra-lab)
# Usage: make infra-up
# Network: lab_local — product overlays join this network as external.
# Core only: Postgres · Redis · LiteLLM. No product apps. No second Postgres/Redis.
# Extension hole: see docker-compose.streaming.yml (optional profile; not default).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lab-postgres
    networks:
      - lab_local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adh}
      POSTGRES_DB: ${POSTGRES_DB:-adh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/01-init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
      - ./config/postgres/02-init-databases.sh:/docker-entrypoint-initdb.d/02-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adh} -d ${POSTGRES_DB:-adh}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lab-redis
    networks:
      - lab_local
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # LiteLLM — shared AI gateway. Host http://localhost:4000 → :8000
  # In-compose DNS: litellm:8000/v1 (service name unchanged for overlays).
  litellm:
    image: ghcr.io/berriai/litellm-database:main-stable
    container_name: lab-litellm
    networks:
      - lab_local
    ports:
      - "4000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-adh}:${POSTGRES_PASSWORD:-adh}@postgres:5432/${LITELLM_POSTGRES_DB:-litellm}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-adh-local-master}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-adh-local-salt-change-me}
      STORE_MODEL_IN_DB: "True"
      UI_USERNAME: ${UI_USERNAME:-adh-admin}
      UI_PASSWORD: ${UI_PASSWORD:-adh-admin}
      ROOT_REDIRECT_URL: /ui
      DOCS_URL: /docs
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_ENABLED: "true"
      CACHE_TTL: ${CACHE_TTL:-3600}
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./config/litellm:/app/config:ro
    command: ["--config", "/app/config/config.yaml", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/liveliness')",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Platform profile. Not started by `make infra-up`.
  # `make platform-up` brings these up after the core lab is healthy.
  temporal:
    image: temporalio/auto-setup:1.29.7
    profiles: ["platform"]
    container_name: lab-temporal
    networks:
      - lab_local
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?TEMPORAL_DB_PASSWORD is required}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      SKIP_DB_CREATE: "true"
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.58.1
    profiles: ["platform"]
    container_name: lab-temporal-ui
    networks:
      - lab_local
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  paperclip:
    image: drivestream-lab/paperclip:mandate-acpx-root-pack
    profiles: ["platform"]
    container_name: lab-paperclip
    networks:
      - lab_local
    ports:
      - "3100:3100"
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      PAPERCLIP_HOME: /paperclip
      DATABASE_URL: postgresql://paperclip:${PAPERCLIP_DB_PASSWORD:?PAPERCLIP_DB_PASSWORD is required}@postgres:5432/paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_ACPX_PROVIDER_PACKAGE_ROOT: /opt/paperclip-runner/provider-pack
      PAPERCLIP_ACPX_PROVIDER_PACKAGE_MANIFEST: /opt/paperclip-runner/provider-pack/package.json
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?PAPERCLIP_TOOL_ACTION_SIGNING_SECRET is required}
    volumes:
      - paperclip_data:/paperclip
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped

networks:
  lab_local:
    name: lab_local
    external: true

volumes:
  postgres_data:
  redis_data:
  paperclip_data:
